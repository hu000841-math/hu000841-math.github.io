<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="Yang Hu">
  <title>{{ page.title | escape }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <style>
    body {
      margin: 8px;
      color: #000;
      background: #fff;
      font: 16px/1.5 "Times New Roman", Times, serif;
    }
    a { overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid #0000ee; outline-offset: 3px; }
    h1, h2, h3 { line-height: 1.2; }
    li { margin-bottom: .35em; }
    li p { margin: .35em 0; }
    hr { margin: 1.25em 0; }
    .contact { font-style: italic; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { position: static; }
    footer { margin-top: 1.5em; }
    @media print {
      .jump-to, .skip { display: none; }
      h2, h3 { break-after: avoid; }
      li { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    {{ content }}
  </main>
  <footer>
    <hr>
    <small>Last updated: {{ page.updated | escape }}.</small>
  </footer>
</body>
</html>
